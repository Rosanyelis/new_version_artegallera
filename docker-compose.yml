services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: artegallera
      POSTGRES_USER: artegallera
      POSTGRES_PASSWORD: artegallera
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - '1935:1935'
      - '8888:8888'

volumes:
  postgres_data:
